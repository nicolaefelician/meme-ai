workflows:
  ios-native-workflow:
    name: iOS Native
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Pileus Api Key
    environment: 
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pileus.meme.ai
      vars:
        BUNDLE_ID: "com.pileus.meme.ai"
        WIDGET_BUNDLE_ID: "com.pileus.meme.ai.CoinWidget"
        XCODE_WORKSPACE: "MemeWatch.xcworkspace"
        XCODE_SCHEME: "MemeWatch"
        APP_STORE_APPLE_ID: 6746212315
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install
      - name: Install Codemagic CLI tools
        script: |
          pip3 install codemagic-cli-tools
      - name: List available bundle identifiers
        script: |
          app-store-connect list-bundle-ids
      - name: Fetch code signing
        script: |
          keychain initialize
          keychain add-certificates
          echo "Fetching signing files for main app: $BUNDLE_ID"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --strict-match-app-id
          echo "Fetching signing files for widget: $WIDGET_BUNDLE_ID"
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --create --strict-match-app-id
          echo "=== Listing fetched provisioning profiles ==="
          find ~/Library/MobileDevice -name "*.mobileprovision" -exec bash -c 'echo "Profile: $1"; security cms -D -i "$1" | grep -E "(Name|application-identifier|Entitlements)" -A5' _ {} \;
          xcode-project use-profiles
      - name: Set up provisioning profiles settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Debug provisioning profiles
        script: |
          security find-identity -v -p codesigning
          find ~/Library/MobileDevice -name "*.mobileprovision" -exec bash -c 'echo "=== $1 ==="; /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i "$1")' _ {} \;
      - name: List available schemes
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" -list
      - name: Use CodeMagic generated export options
        script: |
          # CodeMagic automatically generates export_options.plist with correct profiles
          # Let's just verify it exists and show its contents
          if [ -f "/Users/builder/export_options.plist" ]; then
            echo "=== Using CodeMagic generated export options ==="
            cat /Users/builder/export_options.plist
            cp /Users/builder/export_options.plist ./export_options.plist
          else
            echo "ERROR: CodeMagic did not generate export_options.plist"
            exit 1
          fi
      - name: Debug Xcode build and archive
        script: |
          set -e
          echo "Building with workspace: $XCODE_WORKSPACE, scheme: $XCODE_SCHEME"
          # Create archive directory
          mkdir -p "$CM_BUILD_DIR/build/ios/xcarchive"
          # Try with explicit code signing settings
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/MemeWatch.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="99L37595Y5" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Debug provisioning profiles before export
        script: |
          echo "=== Provisioning Profiles in Archive ==="
          find "$CM_BUILD_DIR/build/ios/xcarchive" -name "*.mobileprovision" -exec bash -c 'echo "Profile: $1"; security cms -D -i "$1" | grep -A5 -B5 "application-identifier\|Entitlements\|Name"' _ {} \;
          echo "=== Available Provisioning Profiles ==="
          find ~/Library/MobileDevice -name "*.mobileprovision" -exec bash -c 'echo "=== $1 ==="; security cms -D -i "$1" | grep -A10 -B2 "Name\|application-identifier\|Entitlements"' _ {} \;
      - name: Export IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          echo "=== Export Options ==="
          cat export_options.plist
          echo "=== Starting Export ==="
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/MemeWatch.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist export_options.plist \
            -verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true