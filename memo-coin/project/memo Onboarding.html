<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memo · Onboarding Flow</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e10; font-family: -apple-system, "SF Pro", system-ui, sans-serif; color: #fff; overflow-x: hidden; }
  * { box-sizing: border-box; }
  .frame-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.55); text-align: center; margin-top: 14px; letter-spacing: -0.2; }
  .frame-step { font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; margin-top: 2px; letter-spacing: 0.4; text-transform: uppercase; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="screens/Welcome.jsx"></script>
<script type="text/babel" src="screens/SocialProof.jsx"></script>
<script type="text/babel" src="screens/FeatureAlerts.jsx"></script>
<script type="text/babel" src="screens/FeatureFeed.jsx"></script>
<script type="text/babel" src="screens/Personalize.jsx"></script>
<script type="text/babel" src="screens/Trust.jsx"></script>
<script type="text/babel" src="screens/Paywall.jsx"></script>
<script type="text/babel" src="screens/App.jsx"></script>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#22c55e",
  "view": "flow"
}/*EDITMODE-END*/;

const ACCENTS = ['#22c55e', '#a855f7', '#f97316', '#06b6d4', '#ec4899'];

function ScreenFrame({ label, step, accent, screenName }) {
  // Render a single screen in a frame, no interaction needed since it's static
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <IOSDevice dark width={360} height={780}>
        <ScreenPreview screenName={screenName} accent={accent} />
      </IOSDevice>
      <div className="frame-step">Step {step}</div>
      <div className="frame-label">{label}</div>
    </div>
  );
}

function ScreenPreview({ screenName, accent }) {
  // Wrapper that renders a screen with no-op handlers (purely for static preview)
  const noop = () => {};
  switch (screenName) {
    case 'welcome':    return <WelcomeScreen onContinue={noop} accent={accent} />;
    case 'social':     return <SocialProofScreen onContinue={noop} accent={accent} />;
    case 'alerts':     return <FeatureAlertsScreen onContinue={noop} accent={accent} />;
    case 'feed':       return <FeatureFeedScreen onContinue={noop} accent={accent} />;
    case 'experience': return <ExperienceScreen onContinue={noop} accent={accent} value="degen" setValue={noop} step={1} total={3} />;
    case 'chains':     return <ChainsScreen onContinue={noop} accent={accent} values={['sol','base']} toggle={noop} step={2} total={3} />;
    case 'goals':      return <GoalsScreen onContinue={noop} accent={accent} values={['pumps','whales']} toggle={noop} step={3} total={3} />;
    case 'notify':     return <NotifyScreen onContinue={noop} onSkip={noop} accent={accent} />;
    case 'analyzing':  return <AnalyzingStatic accent={accent} />;
    case 'reviews':    return <ReviewsScreen onContinue={noop} accent={accent} />;
    case 'paywall':    return <PaywallScreen onContinue={noop} onSkip={noop} accent={accent} />;
    case 'done':       return <DoneScreen onContinue={noop} accent={accent} />;
    default:           return null;
  }
}

// Static analyzing — frozen at 60% so it doesn't run animations on grid view
function AnalyzingStatic({ accent }) {
  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      background: '#0a0a0b', color: '#fff', padding: '80px 24px 30px',
      alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden',
    }}>
      <div style={{ position: 'relative', width: 180, height: 180 }}>
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="80" stroke="rgba(255,255,255,0.06)" strokeWidth="6" fill="none"/>
          <circle cx="90" cy="90" r="80" stroke={accent} strokeWidth="6" fill="none"
            strokeLinecap="round" strokeDasharray="301 502"
            transform="rotate(-90 90 90)"
          />
        </svg>
        <div style={{
          position: 'absolute', inset: 0, display: 'flex',
          alignItems: 'center', justifyContent: 'center',
          fontSize: 36, fontWeight: 800, letterSpacing: -1,
        }}>60%</div>
      </div>
      <h2 style={{ fontSize: 24, fontWeight: 800, letterSpacing: -0.6, margin: '32px 0 8px', textAlign: 'center' }}>
        Building your feed…
      </h2>
      <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.55)', margin: 0, textAlign: 'center' }}>
        Tuning alerts to your goals…
      </p>
    </div>
  );
}

const SCREEN_LABELS = {
  welcome:    ['Welcome',           'Hero with live ticker tape'],
  social:     ['Social proof',      '247K traders flex'],
  alerts:     ['Feature: Alerts',   'Real-time pump notifications'],
  feed:       ['Feature: Top movers','Live coin feed with sparklines'],
  experience: ['Personalize 1/3',   'Experience level'],
  chains:     ['Personalize 2/3',   'Chains they trade'],
  goals:      ['Personalize 3/3',   'Top priorities'],
  notify:     ['Notifications',     'Soft permission ramp'],
  analyzing:  ['Building feed',     'Commitment loader'],
  reviews:    ['Reviews',           'App Store testimonials'],
  paywall:    ['Paywall',           'Free trial · plan picker'],
  done:       ['Done',              "You're in"],
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const accent = t.accent;
  const view = t.view;

  return (
    <>
      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakColor label="Accent" value={accent} options={ACCENTS}
            onChange={v => setTweak('accent', v)} />
        </TweakSection>
        <TweakSection title="View">
          <TweakRadio label="Mode" value={view}
            options={[
              {label: 'Flow', value: 'flow'},
              {label: 'Grid', value: 'grid'},
            ]}
            onChange={v => setTweak('view', v)} />
        </TweakSection>
      </TweaksPanel>

      {view === 'flow' ? <FlowView accent={accent} /> : <GridView accent={accent} />}
    </>
  );
}

function FlowView({ accent }) {
  return (
    <div style={{
      minHeight: '100vh', display: 'flex', flexDirection: 'column',
      alignItems: 'center', padding: '40px 20px',
      background: 'radial-gradient(circle at 50% 0%, rgba(34,197,94,0.06), transparent 60%), #0e0e10',
    }}>
      <div style={{ textAlign: 'center', marginBottom: 32, maxWidth: 560 }}>
        <div style={{
          display: 'inline-flex', padding: '4px 10px', borderRadius: 999,
          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.08)',
          fontSize: 11, fontWeight: 600, letterSpacing: 0.6, color: 'rgba(255,255,255,0.6)',
          textTransform: 'uppercase', marginBottom: 12,
        }}>memo · onboarding v1</div>
        <h1 style={{ fontSize: 32, fontWeight: 800, letterSpacing: -1, margin: '4px 0 8px' }}>
          12-step conversion flow
        </h1>
        <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.55)', margin: 0, lineHeight: 1.5 }}>
          Tap through the prototype. Use Tweaks → Grid to see all screens at once.
        </p>
      </div>

      <IOSDevice dark width={402} height={874}>
        <OnboardingFlow accent={accent} />
      </IOSDevice>

      <div style={{
        marginTop: 32, padding: '20px 24px', maxWidth: 560,
        background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)',
        borderRadius: 18,
      }}>
        <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: accent, marginBottom: 10 }}>
          Why this flow converts
        </div>
        <div style={{ display: 'grid', gap: 10, fontSize: 13, color: 'rgba(255,255,255,0.7)', lineHeight: 1.5 }}>
          <div>→ <b style={{ color: '#fff' }}>Hook fast.</b> Live ticker on screen 1 proves the product before any words.</div>
          <div>→ <b style={{ color: '#fff' }}>Sell value before asking for anything.</b> Features come before personalization questions.</div>
          <div>→ <b style={{ color: '#fff' }}>3-step personalization</b> creates IKEA-effect commitment — feels like "your" app by screen 7.</div>
          <div>→ <b style={{ color: '#fff' }}>Soft notification ramp</b> with mock alert preview lifts iOS push opt-in 2-3x vs cold prompt.</div>
          <div>→ <b style={{ color: '#fff' }}>Analyzing loader</b> raises perceived value so the paywall feels deserved, not arbitrary.</div>
          <div>→ <b style={{ color: '#fff' }}>Reviews right before paywall</b> — peak social proof at peak intent.</div>
          <div>→ <b style={{ color: '#fff' }}>Free trial framing</b> + dismissable X (App Store guideline) keeps reviews safe.</div>
        </div>
      </div>
    </div>
  );
}

function GridView({ accent }) {
  return (
    <div style={{
      padding: '40px 24px',
      background: '#0e0e10',
      minHeight: '100vh',
    }}>
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <h1 style={{ fontSize: 28, fontWeight: 800, letterSpacing: -0.8, margin: '0 0 6px' }}>
          All 12 screens
        </h1>
        <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.5)', margin: '0 0 36px' }}>
          memo · onboarding flow at a glance
        </p>
        <div style={{
          display: 'grid', gap: 40,
          gridTemplateColumns: 'repeat(auto-fill, minmax(360px, 1fr))',
          justifyItems: 'center',
        }}>
          {SCREENS.map((s, i) => (
            <ScreenFrame
              key={s}
              label={SCREEN_LABELS[s][0]}
              step={String(i + 1).padStart(2, '0')}
              accent={accent}
              screenName={s}
            />
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
